name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate native code
        run: npx expo prebuild --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Disable Sentry in CI
        run: |
          # Remove sentry.properties to disable Sentry CLI
          rm -f android/sentry.properties
          # Set env var to skip Sentry upload
          echo "SENTRY_CLI_ENABLED=false" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SENTRY_DSN=" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          export SENTRY_CLI_ENABLED=false
          ./gradlew assembleRelease -PsentryCli.enabled=false --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
