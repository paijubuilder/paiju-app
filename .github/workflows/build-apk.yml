name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate native code
        run: npx expo prebuild --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Disable Sentry in CI
        run: |
          # Remove sentry.properties to disable Sentry CLI
          rm -f android/sentry.properties
          # Set env vars to completely disable Sentry
          echo "SENTRY_CLI_ENABLED=false" >> $GITHUB_ENV
          echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> $GITHUB_ENV
          echo "SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD=true" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SENTRY_DSN=" >> $GITHUB_ENV

      - name: Update compileSdk to 36
        run: |
          # Update compileSdkVersion in build.gradle to fix dependency requirements
          sed -i 's/compileSdk = 35/compileSdk = 36/g' android/build.gradle
          # Also update in gradle.properties if present
          sed -i 's/compileSdkVersion=35/compileSdkVersion=36/g' android/gradle.properties || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          export SENTRY_DISABLE_AUTO_UPLOAD=true
          export SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD=true
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
