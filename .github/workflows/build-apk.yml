name: Build WebView APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Create Expo project
        run: |
          npx create-expo-app WebViewApp --template blank
          cd WebViewApp
          npm install react-native-webview

      - name: Replace App.js with WebView
        run: |
          cd WebViewApp
          cat > App.js << 'EOF'
          import React from 'react';
          import { SafeAreaView, StatusBar, StyleSheet } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="dark-content" />
                <WebView
                  source={{ uri: 'https://app-bjaapbe7wkqp.appmiaoda.com' }}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  cacheEnabled={true}
                  cacheMode="LOAD_CACHE_ELSE_NETWORK"
                  startInLoadingState={true}
                  allowsBackForwardNavigationGestures={true}
                  style={styles.webview}
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1 },
            webview: { flex: 1 },
          });
          EOF

      - name: Prebuild and build APK
        run: |
          cd WebViewApp
          npx expo prebuild --clean
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: WebViewApp/android/app/build/outputs/apk/release/*.apk
